<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ifprGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009647"/>
      <stop offset="100%" stop-color="#006E33"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square with IFPR Green -->
  <rect width="512" height="512" rx="112" fill="url(#ifprGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Main Symbol: Pin & Beacon with Plus (+) -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <path d="M0 -140 C-77 -140 -140 -77 -140 0 C-140 70 -50 145 0 205 C50 145 140 70 140 0 C140 -77 77 -140 0 -140 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="85" fill="#00843D"/>
    <!-- Plus symbol in center -->
    <path d="M-16 -52 H16 V-16 H52 V16 H16 V52 H-16 V16 H-52 V-16 H-16 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- IFPR Red Accent Dot -->
  <circle cx="380" cy="380" r="44" fill="#C8102E" stroke="#FFFFFF" stroke-width="8" filter="url(#shadow)"/>

  <!-- Localiza+ Typography -->
  <text x="256" y="468" font-family="'Poppins', -apple-system, system-ui, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">LOCALIZA+</text>
</svg>