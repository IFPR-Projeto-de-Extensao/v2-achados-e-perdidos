    <script>
      // Suppress benign Vite HMR websocket connection errors in sandboxed preview environments where HMR is disabled
      (function() {
        if (typeof window !== 'undefined' && window.console && window.console.error) {
          var _origErr = window.console.error;
          window.console.error = function() {
            var firstArg = arguments[0];
            if (
              typeof firstArg === 'string' &&
              (firstArg.indexOf('[vite] failed to connect to websocket') !== -1 ||
               firstArg.indexOf('[vite] connecting...') !== -1 ||
               (firstArg.indexOf('[vite]') !== -1 && firstArg.indexOf('websocket') !== -1))
            ) {
              return;
            }
            return _origErr.apply(window.console, arguments);
          };
        }
      })();
    </script>
